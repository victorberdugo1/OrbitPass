proxy_cache_path /var/cache/nginx/trek levels=1:2 keys_zone=trek:50m max_size=2g inactive=30d;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /trek/ {
        proxy_pass https://trek.nasa.gov/tiles/Moon/EQ/;
        proxy_ssl_server_name on;
        proxy_set_header Host trek.nasa.gov;
        proxy_cache trek;
        proxy_cache_valid 200 30d;
    }

    location /horizons {
        proxy_pass https://ssd.jpl.nasa.gov/api/horizons.api;
        proxy_ssl_server_name on;
        proxy_set_header Host ssd.jpl.nasa.gov;
    }
}
